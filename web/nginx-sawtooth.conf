# sawtooth-splat 静态站点的 Nginx 配置（CLAUDE.md M6）
#
# 这份配置在本地 nginx 上实测通过，BT Panel 上线时把 server{} 里的几个 location
# 原样搬过去即可（root 换成站点目录，listen/server_name 用面板生成的）。
#
# 站点是**纯静态**的，没有任何后端（§5「静态优先」）。
#
# 三类文件要区别对待，混在一起处理会出问题：
#   assets/*   构建产物，文件名带 hash  → 可以永久缓存
#   splats/*   splat 资产，文件名不带 hash → 只能短缓存 + ETag
#   index.html 入口                      → 绝不能缓存

server {
    listen       8080;
    server_name  localhost;

    # 本地测试用的路径；上线时换成 BT Panel 的站点目录（通常是 /www/wwwroot/<域名>）
    # 注意别放在 /home/xxx 下面：nginx 的 worker 以 www-data 身份跑，
    # 而 /home/<user> 默认是 750，进不去，表现为莫名其妙的 403。
    root   /var/www/sawtooth;
    index  index.html;

    # 打开 gzip，但**只对文本类型**。下面 splats 那个 location 会显式关掉它。
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # ---- 入口：绝不缓存 ----
    # index.html 里引用的是带 hash 的资源名。它自己一旦被缓存住，
    # 就算重新部署了，客户端也还在按旧 HTML 去取旧资源，等于没更新。
    # expires off：不让 nginx 再自己生成一份 Cache-Control，否则响应里会出现
    # 两个 Cache-Control 头（实测过），语义含糊、也不好 review。
    location = /index.html {
        expires      off;
        add_header   Cache-Control "no-cache, must-revalidate";
    }

    # ---- 构建产物：文件名带 hash，可以往死里缓存 ----
    # 内容一变文件名就变，所以 immutable 是安全的。
    location /assets/ {
        expires      off;
        add_header   Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- 自托管字体：已经是压缩格式 ----
    # woff2 本身就压过了，再 gzip 纯属白费 CPU。它们也在 /assets/ 下带 hash。
    location ~* \.woff2$ {
        gzip         off;
        expires      off;
        add_header   Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- splat 资产：这里是整份配置的重点 ----
    location /splats/ {
        # .sog / .spz 都不在 nginx 自带的 mime.types 里，不声明的话会退到
        # default_type（多数默认是 text/plain），浏览器侧容易出怪事。
        types { }
        default_type application/octet-stream;

        # **绝不能对 .sog 开 gzip**，两个理由，第二个更要命：
        #   1. SOG 内部已经是 WebP 压缩，再压一遍几乎压不动，纯耗 CPU（CLAUDE.md M6 明写）
        #   2. nginx 一旦对响应做了 gzip，就会丢掉 Accept-Ranges 并拒绝 Range 请求 ——
        #      而 Range 是验收标准 4（为后续 .RAD 流式加载预留）的前提条件
        gzip off;

        # 不用写 add_header Accept-Ranges —— nginx 的 static 模块本来就会发，
        # 手动再加一次响应里会出现两个同名头（实测过）。真正要守住的是上面那行
        # gzip off：只要没被压，Range 就是通的（已实测 206 + Content-Range）。

        # 注意**不能**用 immutable：splat 文件名不带 hash（是 public/ 原样复制过去的），
        # 换了场景还叫 test.sog，客户端会一直吃旧的。
        # 靠 nginx 默认的 ETag 走 304，代价只有一个往返、不传 body。
        expires    off;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # ---- 其余（含 SPA 兜底）----
    # 目前没有客户端路由，但留着不碍事，将来加了路由不用改配置。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
